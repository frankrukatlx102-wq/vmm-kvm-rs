[package]
name = "vmm-kvm-rs"
version = "0.1.0"
edition = "2024"
description = "Native Linux QEMU/KVM manager with a gpui interface and libvirt backend"
repository = "https://github.com/frankrukatlx102-wq/vmm-kvm-rs"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["qemu", "kvm", "libvirt", "virtualization", "gpui"]
categories = ["system-tools", "emulators"]

[dependencies]
anyhow = "1.0.104"
gpui = "0.2.2"
rfd = "0.18.0"
virt = "0.5.0"
xmltree = "0.12.0"
